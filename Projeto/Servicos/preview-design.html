<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview cartão</title>
    <link rel="stylesheet" href="../Includes/css/global.css">
    <link rel="stylesheet" href="../Includes/css/layout.css">
    <link rel="stylesheet" href="CSS/servicos.css">
    <style>
        body { background: #f4f2f7; }
        .preview-envelope { padding: 40px; max-width: 1200px; }
    </style>
</head>
<body>
    <div class="preview-envelope">
        <article class="servico">
            <div class="foto-servico"><img src="../assets/15_anos.png" alt=""></div>
            <div class="informacao-servico">
                <span class="tag-evento">Festa de 15 Anos</span>
                <p><img src="../assets/email_solicitacao.svg" alt=""> camilaoilveira@gmail.com</p>
                <p><img src="../assets/perfil-bolsa.png" alt=""> Pacote Avançado - R$ 4.000,00</p>
            </div>
            <div class="bloco-evento">
                <div class="linha-evento">
                    <p><img src="../assets/local_solicitacoes.svg" alt=""> Av. Paulista, 1578 - São Paulo</p>
                    <p><img class="icone-roxo" src="../assets/user_dashboard.svg" alt=""> 120</p>
                </div>
                <div class="linha-evento">
                    <p><img src="../assets/relogio_solicitacoes.svg" alt=""> 19:00-23:00</p>
                    <p><img src="../assets/calendario_solicitacoes.svg" alt=""> 20/01/2027</p>
                </div>
            </div>
            <div class="acoes-servico">
                <a class="botao-detalhes" href="#">Ver detalhes <img src="../assets/seta_solicitacoes.svg" alt=""></a>
                <small>Recebido em 10/08/2025 às 14:32</small>
            </div>

    </div>
</body>
</html>
